spring.application.name=DevPulse
server.address=127.0.0.1
server.port=${PORT:8081}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:55432/devpulse}
spring.datasource.username=${DB_USER:devpulse_app}
spring.datasource.password=${DB_PASSWORD}
spring.session.jdbc.initialize-schema=never
spring.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
devpulse.ingestion.allowed-origins=${INGEST_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
devpulse.ingestion.daily-event-limit=${INGEST_DAILY_EVENT_LIMIT:100000}
